name: Deploy to Vercel

# Builds the Astro site and deploys to Vercel.
# Until package.json exists the job exits cleanly.
#
# Required repo secrets:
#   VERCEL_TOKEN      – from https://vercel.com/account/tokens
#   VERCEL_ORG_ID     – from project Settings → General → "Project ID" section
#   VERCEL_PROJECT_ID – from project Settings → General → "Project ID"
#
# To get the IDs run inside the repo after `vercel link`:
#   cat .vercel/project.json

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'public/**'
      - 'astro.config.*'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Astro app
        id: check
        run: |
          if [ -f package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"
          else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Skip (no Astro app yet)
        if: steps.check.outputs.found != 'true'
        run: echo "package.json not present — nothing to deploy yet."

      - name: Setup Node
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.check.outputs.found == 'true'
        run: npm ci || npm install

      - name: Build (Vercel output)
        if: steps.check.outputs.found == 'true'
        run: npx vercel@latest build --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        if: steps.check.outputs.found == 'true'
        run: npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
